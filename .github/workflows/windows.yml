name: Build standalone Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install installer compiler on build runner
        run: choco install innosetup --yes --no-progress

      - name: Compile engine, bundle runtime, smoke-test, build installer
        shell: pwsh
        run: ./tools/build_windows.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JUPITAR-Standalone-Windows-Installer
          path: release/
          if-no-files-found: error

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JUPITAR-Build-Reports
          path: frozen-smoke-test.json
          if-no-files-found: ignore
